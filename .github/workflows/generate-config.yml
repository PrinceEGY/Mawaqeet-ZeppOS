name: Generate app-config.js

on:
  push:
    paths:
      - "app.json"

jobs:
  generate-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run generate-config script
        run: node scripts/generate-config.js

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Check for changes
        id: git-check
        run: echo "modified=$(git status --porcelain | grep 'app-config.js' || echo '')" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.modified
        run: |
          git add app-config.js
          git commit -m "chore: Auto-generate app-config.js from app.json [skip ci]"
          git push
